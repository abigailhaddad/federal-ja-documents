# Changes to the fields the email, this site and the dataset show, newest first.
# Rendered as changelog.html on https://woah-jas.abigailhaddad.com by digest/site.py.
#
# Add an entry whenever a published field is added, removed, renamed, or changes
# what it means or how it is checked; in the same pull request as the change.
# Keys: date (YYYY-MM-DD, the day it went live), where ("Email and website",
# "Dataset" or both), title, text (plain sentences; say what changed and why,
# with a count where there is one), link (the pull request or commit).

entries:
  - date: "2026-11-12"
    where: "Dataset"
    title: "Six fields no longer published; extension counts only where stated"
    text: >-
      Fields from the main extraction that had only been checked on a handful of cases were each read
      against the document on a random sample of 30. Removed from analysis/extractions.parquet:
      need_by_date (19 of 30 right), stated_pop_limit_days (18 of 30), urgency_trigger (17 of 30),
      bridge_or_extension (23 of 30 "yes" right), and, on their earlier validation,
      market_research_methods (77-84% of codes right) and contract_types (11 of 18 types found).
      prior_extension_count (25 of 30, the rest unclear) is now published only when the document states
      the number ("the fifth bridge", "two separate extensions"): 72 of 189 counts, 41 of 45 right in two
      samples, none wrong. Kept after the same check: incumbent_piid (30 of 30), covered_piids (28, none
      wrong), is_letter_contract (28 of 30) and funding_sources (27, none wrong). The model's other answers
      stay in record_json, unchecked.
    link: "https://github.com/abigailhaddad/federal-ja-documents/tree/main/docs/checks/main_fields"

  - date: "2026-11-12"
    where: "Email and website"
    title: "The picks no longer see failed fields"
    text: >-
      The model that chooses the day's picks no longer sees the urgency trigger or the bridge flag, not
      even as hints, because they failed their checks; it sees the number of earlier extensions only where
      the document states it.
    link: "https://github.com/abigailhaddad/federal-ja-documents/blob/main/docs/digest.md"

  - date: "2026-11-12"
    where: "Dataset"
    title: "Which interested firm is the contractor itself"
    text: >-
      analysis/extractions.parquet gains interested_firms_contractor_entry: the entries of
      interested_firms_named that are the J&A's own proposed contractor, by exact name (case,
      punctuation and Inc/LLC/Corp aside). In the table of 2026-11-11, 989 of 2,177 lists contained the
      contractor by exact name, and on 730 it was the only firm, so counting interested_firms_named overstates
      competition. 30 of 30 random matches were right. Looser matching caught parent companies and
      sibling units and is not used, so a blank means no exact match, not that the contractor isn't
      listed. The dataset card also now says that its checks are samples (30 of 30 still allows an
      error rate up to about 10%) judged by an AI model, not a person, and the sample files behind
      every count are now published in docs/checks with a table of which file backs which count.
    link: "https://github.com/abigailhaddad/federal-ja-documents/blob/main/src/federal_ja/analysis/extras.py"

  - date: "2026-11-12"
    where: "Email and website"
    title: "The picks see the checked facts"
    text: >-
      The model that chooses the day's picks now also sees the checked fields from the second reading
      of each J&A (GAO protest numbers, ceiling changes, a current or previous contractor named, DLA
      approved sources), labelled as checked against the document. Quotes are still copied from the
      document and checked word for word. In a test on two past days (dry runs, nothing sent) the picks
      barely changed and the write-ups used the documents' exact figures more often.
    link: "https://github.com/abigailhaddad/federal-ja-documents/blob/main/docs/extras.md"

  - date: "2026-11-11"
    where: "Dataset"
    title: "Five more columns from the second reading"
    text: >-
      analysis/extractions.parquet gains interested_firms_named (firms the document names as having
      responded or expressed interest; it can include the firm that got the award and can miss some, so
      a blank is "not found", never "none"), not_to_exceed_usd (all 43 values read and right),
      delay_to_compete_quote and cost_to_compete_quote (the document's own sentence; 30 of 30 and 29 of
      30), and technical_data_reasons (four reasons read from the document's own words; 39 of 41 right in
      random samples). A fifth reason, "proprietary to the contractor", was right on only 11 of 20 and is
      not published.
    link: "https://github.com/abigailhaddad/federal-ja-documents/blob/main/docs/extras.md"

  - date: "2026-11-11"
    where: "Dataset"
    title: "Six new columns from a second reading of each J&A"
    text: >-
      analysis/extractions.parquet gains columns from a second model call: a current or previous
      contractor the document names, how a firm not yet approved can become a source, ceiling changes
      (only when the prior ceiling, the increase and the new ceiling are all stated and add up), GAO
      protest numbers (precedent citations left out), DLA approved sources from the form's own table,
      and National Stock Numbers. Each value comes with the document's own words. These are the fields
      that held up when 30 random notices each were read against the document. Others the call asks
      for (interested firms, the delay and cost of competing, not-to-exceed amounts, the technical-data
      reason) did not, and are not published.
    link: "https://github.com/abigailhaddad/federal-ja-documents/blob/main/docs/extras.md"

  - date: "2026-11-10"
    where: "Email and website"
    title: '"Value redacted" only where the document marks a redaction'
    text: >-
      The value slot says "value redacted" only when the document marks a redaction: a [REDACTED]
      marker in the text, or a file named as redacted. Where the text shows only a blank where the
      figure belongs, it now says "value blank or redacted", because a black box and an empty field
      look the same in a PDF's text. Of the 6,958 notices that showed "value redacted", 223 had no
      such mark.
    link: "https://github.com/abigailhaddad/federal-ja-documents/pull/45"

  - date: "2026-11-10"
    where: "Email and website"
    title: "Every dollar figure says what it is; nothing shown from scrambled text"
    text: >-
      Each figure in the notice list now carries its basis (total incl. options, base period only,
      modification/increase, ceiling, per year/period), as the picks already did, so a ceiling
      increase, a yearly rent and a contract total no longer look alike. A figure with no label that
      would be true is not shown. For documents whose PDF text layer is scrambled, vendor, value and
      authority are left blank: on November 6, six VA notices read "value redacted" although each
      document states its value.
    link: "https://github.com/abigailhaddad/federal-ja-documents/pull/44"

  - date: "2026-11-10"
    where: "Email and website"
    title: "Vendor lists every firm the justification names"
    text: >-
      The vendor slot now lists every firm the justification names, with the count ("A; B; C (3
      firms named)"), instead of only the first. Showing the first firm alone made a notice with
      several approved sources read as a sole source. 715 notices in the extraction table name more
      than one firm.
    link: "https://github.com/abigailhaddad/federal-ja-documents/pull/42"

  - date: "2026-10-26"
    where: "Dataset"
    title: "Non-J&A notices moved out of the extraction table"
    text: >-
      analysis/extractions.parquet no longer includes Special Notices that don't look like a
      justification (most are notices of intent to sole source) or notices whose documents contain no
      J&A. They are kept in analysis/extractions_excluded.parquet with the reason, so nothing is lost.
    link: "https://github.com/abigailhaddad/federal-ja-documents/commit/da11022"

  - date: "2026-10-21"
    where: "Email and website"
    title: "First issues"
    text: >-
      Each email lists every new notice with a one-line summary written by Claude (not checked
      against the document), and picks out at most five. Vendor, value and authority in the list come
      only from extraction fields whose quotes were checked against the document.
    link: "https://github.com/abigailhaddad/federal-ja-documents/commit/86bd6b9"
