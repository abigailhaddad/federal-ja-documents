# Column descriptions for the published tables. src/federal_ja/collect/data_docs.py reads this file and the
# parquet files and writes docs/data_dictionary.md; it stops with an error if a parquet column is missing
# here or a column here is not in the parquet, so the dictionary can't drift from the schema.
#
# Each description comes from the code that builds the column (collect/sources.py, store.py, pipeline.py,
# sam_api.py, sam_award.py, usaspending.py, published.py, hf_sync.py, links.py; analysis/table.py,
# extract.py, extras.py, tagger.py, text.py), from the dataset card text in collect/card.py, or from docs/.
# Columns copied from SAM.gov's CSV or attachment-list API whose meaning SAM does not document anywhere this
# repo uses are listed in `unconfirmed`; the dictionary marks them.
#
# theme_status.parquet has no builder in this repo (a one-off snapshot uploaded by hand on 2026-10-18); its
# descriptions come from tagger.py's review record and were checked against the table itself.

dataset = "abigailhaddad/federal-ja-documents"

[tables.notices]
file = "data/notices.parquet"
config = "notices"
grain = "One row per SAM.gov Contract Opportunities notice collected: Type starting with \"Justification\", or a Special Notice whose title matches the J&A pattern (`collection_reason`), posted on or after the start date."
primary_key = "notice_id"
unconfirmed = ["cgac", "fpds_code", "aac_code", "base_type", "archive_type", "archive_date", "classification_code", "active"]

[tables.notices.columns]
notice_id = "SAM's NoticeId."
sam_link = "The notice's public page, `https://sam.gov/opp/<notice_id>/view`."
title = "SAM CSV `Title`."
solicitation_number = "SAM CSV `Sol#`."
agency = "SAM CSV `Department/Ind.Agency`."
cgac = "SAM CSV `CGAC`, as given (an agency code)."
sub_tier = "SAM CSV `Sub-Tier`."
fpds_code = "SAM CSV `FPDS Code`, as given."
office = "SAM CSV `Office`."
aac_code = "SAM CSV `AAC Code`, as given."
posted_date = "SAM CSV `PostedDate`, as given (e.g. `2026-10-15 15:03:33`). Rows with an unparseable date go to `exclusions`."
type = "SAM CSV `Type`, as the posting office set it: `Justification` (or `Justification and Approval (J&A)`) or `Special Notice`."
collection_reason = "Why the notice is here: `justification_type` (its Type starts with \"Justification\") or `special_notice_title_match` (a Special Notice whose title matches the J&A pattern in the card; a candidate only)."
base_type = "SAM CSV `BaseType`, as given."
archive_type = "SAM CSV `ArchiveType`, as given (e.g. `auto15`, `auto30`, `autocustom`, `manual`)."
archive_date = "SAM CSV `ArchiveDate`, as given."
naics_code = "SAM CSV `NaicsCode`: the NAICS code on the notice."
classification_code = "SAM CSV `ClassificationCode`, as given."
active = "SAM CSV `Active`: `Yes` or `No`."
award_number = "SAM CSV `AwardNumber`, typed by the posting office. For a J&A for one order it is often the vehicle, not the order (see `sam_award_order_number`)."
award_date = "SAM CSV `AwardDate`."
award_amount = "SAM CSV `Award$`, as text."
awardee = "SAM CSV `Awardee`, as given (name with city and ZIP run together)."
description = "SAM CSV `Description`."
csv_link = "SAM CSV `Link`: the logged-in workspace view, not the public page (use `sam_link`)."
source_file = "The source CSV the kept row came from (the daily active file `ContractOpportunitiesFullCSV.csv` or a yearly `FY<YYYY>_archived_opportunities.csv`). When a notice is in several files, the row with the latest PostedDate is kept; ties go to the active file, then the newest archive."
source_files = "Every source CSV the notice was seen in."
row_fingerprint = "SHA-1 of the row's Title, Sol#, PostedDate, Type, BaseType, ArchiveType, ArchiveDate, AwardNumber and Description. A change means the notice was edited on SAM and its attachment list is re-checked."
first_seen_at = "When the collector first saw the notice (UTC)."
resources_status = "Result of reading the notice's attachment list: `ok`, `no_attachments`, `error: ...` (e.g. `error: resources 404`) or `pending`."
resources_checked_at = "When the attachment list was last read (UTC)."
attachment_count = "Number of attachments the list returned."
sam_award_status = "Result of reading SAM's notice record (`/opps/v2/opportunities/<notice_id>`): `ok` (award block read), `no_award` (record read, no award block), `not_found` (404), `error: ...`, `pending`; empty: not fetched yet."
sam_award_checked_at = "When the notice record was read (UTC)."
sam_award_number = "`award.number` from the notice record, as typed (normally the same as `award_number`)."
sam_award_order_number = "`award.deliveryOrderNumber`: the order the J&A is for, when it is for an order. Free text, not validated."
sam_award_date = "`award.date` from the notice record."
sam_award_amount = "`award.amount` from the notice record, as text."
sam_awardee_name = "`award.awardee.name` from the notice record (often empty on J&As)."
sam_awardee_uei = "`award.awardee.ueiSAM` from the notice record."
sam_award_modification_number = "`award.justificationAuthority.modificationNumber` from the notice record."
sam_justification_authority = "`award.justificationAuthority.authority`: SAM's code for the authority selected on the form (e.g. `far1`, `far13`, `2`), as stored, not normalised. SAM does not publish what each code means; the card lists the values with counts."
sam_organization_id = "`data2.organizationId`: the posting office's SAM Federal Hierarchy key."
usaspending_matched = "True if exactly one USAspending award was matched on `award_number`."
usaspending_match_method = "How the match was made: `exact`, `exact+agency`, `without_modification_number`, `without_modification_number+agency`, `ambiguous`, `piid_not_found`, `no_piid` or `multiple_award_numbers` (meanings in the card)."
usaspending_match_note = "For `ambiguous`: the candidate award keys; for `piid_not_found`: whether the number looks like a solicitation number; for a match at another agency: says so."
usaspending_candidates = "Number of USAspending awards with this PIID."
usaspending_award_key = "USAspending `contract_award_unique_key` of the matched award."
usaspending_permalink = "The matched award's page on usaspending.gov."
usaspending_award_or_idv = "`AWARD` or `IDV`."
usaspending_award_type = "USAspending's award type, e.g. `DEFINITIVE CONTRACT`, `DELIVERY ORDER`, `IDC`, `BPA`."
usaspending_piid = "The matched `award_id_piid` as USAspending writes it."
usaspending_parent_award_piid = "For an order: the PIID of the IDV it was placed under."
usaspending_recipient_name = "The vendor, from the latest transaction."
usaspending_recipient_uei = "The vendor's UEI, from the latest transaction."
usaspending_recipient_parent_name = "The vendor's parent company."
usaspending_awarding_agency = "USAspending's awarding agency."
usaspending_awarding_sub_agency = "USAspending's awarding sub-agency."
usaspending_awarding_office = "USAspending's awarding office."
usaspending_same_agency = "Whether USAspending's awarding agency is the notice's agency, by agency code (Army, Navy and Air Force count as Defense) or name. False is common when an agency orders under another agency's contract. Null when USAspending gives no agency."
usaspending_total_obligated = "Sum of `federal_action_obligation` over the matched award's transactions in the fiscal years read, US dollars: money obligated so far, not the J&A's estimated value. Can be negative."
usaspending_transactions = "Number of transactions summed."
usaspending_current_total_value = "USAspending's award-level base and exercised options value, from the latest transaction."
usaspending_potential_total_value = "USAspending's award-level base and all options value, from the latest transaction."
usaspending_first_action_date = "Earliest `action_date` of the matched award's transactions."
usaspending_latest_action_date = "Latest `action_date`."
usaspending_extent_competed = "Extent competed, as reported on the latest transaction."
usaspending_other_than_full_and_open = "The exception to full and open competition cited on the latest transaction."
usaspending_idv_orders = "IDVs only: number of orders whose parent is this IDV, from all ordering agencies."
usaspending_idv_orders_obligated = "IDVs only: summed obligations of those orders."
usaspending_as_of = "Latest `last_modified_date` in the USAspending files read: how current the USAspending columns are."

[tables.attachments]
file = "data/attachments.parquet"
config = "attachments"
grain = "One row per attachment listed on a notice (SAM's attachment-list endpoint), plus extra rows for additional documents fetched from one supported link."
primary_key = ["notice_id", "resource_id"]
unconfirmed = ["access_status", "export_controlled", "file_exists", "sam_posted_date"]

[tables.attachments.columns]
notice_id = "The notice (`notices.notice_id`)."
agency = "Copy of `notices.agency`, added when the tables are published."
sub_tier = "Copy of `notices.sub_tier`."
office = "Copy of `notices.office`."
notice_title = "Copy of `notices.title`."
posted_date = "Copy of `notices.posted_date`."
notice_type = "Copy of `notices.type`."
award_number = "Copy of `notices.award_number`."
sam_link = "Copy of `notices.sam_link`."
resource_id = "SAM's `resourceId` for the attachment. For an extra document fetched from one link: `<link resource_id>-<n>`. Not unique on its own: the same resource can be listed on several notices."
attachment_id = "SAM's `attachmentId`. Empty on extra documents from a link."
attachment_order = "SAM's `attachmentOrder`: the attachment's position on the notice."
resource_type = "SAM's `type`, lower-cased: `file` or `link`."
filename = "SAM's `name` for a file (or a link's description); for a fetched link, the downloaded document's name."
link_url = "For a link: the URL (`uri`). Empty for files."
mime_type = "SAM's `mimeType` (e.g. `.pdf`)."
size = "SAM's declared `size` in bytes (0 for links). `downloaded_size` is what was received."
access_level = "SAM's `accessLevel`: `public` or `private`. Only public files are downloaded."
access_status = "SAM's `accessStatus`, as given (`public` or `controlled`)."
export_controlled = "SAM's `exportControlled`, as given (as text)."
file_exists = "SAM's `fileExists`, as given (as text)."
deleted_flag = "SAM's `deletedFlag` is `1`. Deleted files are not downloaded."
deleted_date = "SAM's `deletedDate`."
effective_deleted_date = "SAM's `effectiveDeletedDate`. Seen with deletedFlag 0 on files whose download then failed with \"The resource has been deleted\", so these are treated as deleted."
sam_posted_date = "SAM's `postedDate` for the attachment, as given."
in_latest_listing = "True if the attachment was in the notice's attachment list the last time it was read; an attachment SAM later drops stays with False."
download_status = "`ok`, `link` (a link not fetched), `link_error`, `not_public`, `deleted`, `deleted_at_download`, `too_large`, `error`, `pending` or `unsupported_type` (meanings in the card)."
download_error = "The error for a failed download or link fetch."
downloaded_at = "When the file was downloaded (UTC)."
downloaded_size = "Bytes received."
sha256 = "SHA-256 of the bytes received."
file_path = "Path of the original file in this dataset: `files/<notice_id>/<resource_id>_<safe filename>`."
file_kind = "Kind of file the text extractor saw: `pdf`, `docx`, `xlsx`, `text`, `image`, `zip`, `ole` or `other`. Native text is read from `pdf`, `docx`, `xlsx` and `text` files; `pdf` and `image` pages can be transcribed."
page_count = "PDF pages (1 for an image). Empty for other kinds."
pages_with_text = "PDF pages whose text layer counts as text (not listed in `textless_pages`)."
textless_pages = "Page numbers whose text layer has fewer than 300 characters (whitespace stripped) or is font-encoding garbage; these are the pages sent for transcription."
native_text_chars = "Characters of text read from the file itself (PDF text layer, docx, xlsx, text), before any transcription."
needs_transcription = "True if any page is image-only (`textless_pages` not empty), or for an image file. An XFA form never needs it."
text = "Whole-document text: native text, with transcriptions for image-only pages. PDF text has `--- page N ---` markers."
text_source = "Where `text` came from: `pdf_text`, `pdf_xfa`, `docx`, `xlsx`, `text`, `transcription`, `pdf_text+transcription` or `none` (table in the card)."
extract_error = "Error from text extraction, if any."
transcription_model = "Model that transcribed image-only pages (e.g. `claude-haiku-5-5`)."
transcription_prompt_version = "Version of the transcription prompt."
transcription_input_tokens = "Input tokens used for this file's transcriptions, summed over runs."
transcription_output_tokens = "Output tokens used, summed over runs."
transcription_cost_usd = "Cost of this file's transcriptions in US dollars, summed over runs."
transcribed_pages = "Page numbers whose text is a transcription."
transcribed_at = "When the file was last transcribed (UTC)."
transcription_error = "Error from the last transcription, e.g. `refusal`; empty when it succeeded."
uploaded_at = "When the file was committed to this dataset (UTC)."
uploaded_commit = "The Hugging Face commit that added the file."
local_copy = "Whether the collector kept a local copy after uploading (a workflow detail)."
source_host = "Host the document came from: `sam.gov` for SAM files, or the link's host (`www.neco.navy.mil`, `piee.eb.mil`)."
parent_resource_id = "For an extra document from one link: the link's `resource_id`."
link_documents = "For a fetched link: how many documents the link held."

[tables.pages]
file = "data/pages.parquet"
config = "pages"
grain = "One row per page of a downloaded PDF or image attachment."
primary_key = ["notice_id", "resource_id", "page_number"]

[tables.pages.columns]
notice_id = "The notice (`notices.notice_id`)."
agency = "Copy of `notices.agency`, added when the tables are published."
sub_tier = "Copy of `notices.sub_tier`."
office = "Copy of `notices.office`."
notice_title = "Copy of `notices.title`."
posted_date = "Copy of `notices.posted_date`."
notice_type = "Copy of `notices.type`."
award_number = "Copy of `notices.award_number`."
sam_link = "Copy of `notices.sam_link`."
resource_id = "The attachment (`attachments.resource_id`; join on `notice_id` and `resource_id`)."
sha256 = "SHA-256 of the file the page is from (identifies the exact file)."
page_number = "Page number, from 1."
page_count = "Pages in the file."
text_layer_chars = "Characters in the page's own text layer, whitespace stripped."
needs_transcription = "True if the page is image-only: fewer than 300 text-layer characters, or font-encoding garbage (or an image file)."
text = "The page's final text: the native text layer, or the transcription for an image-only page."
text_source = "`native`, `transcription`, `xfa_form` (an XFA form's XML text, one page) or `none`."
text_layer_text = "For a transcribed page: the thin native text layer that the transcription replaced."
transcription_model = "Model that transcribed the page."
transcription_prompt_version = "Version of the transcription prompt."
transcribed_at = "When the page was transcribed (UTC)."
text_engine = "The program that read the text layer: `pdftotext` (from 2026-11-06) or `pypdf`. Empty on rows published before 2026-11-06, which were all read with `pypdf`."

[tables.exclusions]
file = "data/exclusions.parquet"
config = "none (not a config on the card)"
grain = "One row per row the collection rules picked from the source CSVs that is not in `notices`, with the reason. Empty when nothing was excluded."

[tables.exclusions.columns]
notice_id = "SAM's NoticeId; empty when the row had none."
source_file = "The source CSV."
posted_date = "SAM CSV `PostedDate`, as given."
type = "SAM CSV `Type`."
title = "SAM CSV `Title`."
collection_reason = "As in `notices.collection_reason`."
reason = "Why it is not in `notices`: `missing_notice_id` or `unparseable_posted_date`."

[tables.extractions]
file = "analysis/extractions.parquet"
config = "experimental_extractions"
grain = "EXPERIMENTAL, AI-generated (Claude Haiku). One row per notice with a document: its latest extraction record (any prompt version), or a skip record. Special Notices that don't look like a J&A, and notices the model says are not a J&A, are in `extractions_excluded` instead."
primary_key = "notice_id"

[tables.extractions.columns]
notice_id = "The notice (`notices.notice_id`)."
status = "`extracted`, or `skipped` (no record; see `skip_reason`)."
skip_reason = "For a skipped notice: `no_text`, `no_usable_text` or `model_refused`."
sam_link = "The notice's public page."
title = "Notice title at extraction time."
agency = "Notice agency at extraction time."
sub_tier = "Notice sub-tier at extraction time."
posted_date = "Notice posted date at extraction time."
is_ja = "The model's answer: is the document actually a J&A? `yes` or `unclear` here (`no` rows are in `extractions_excluded`)."
doc_kind = "The model's document kind: `justification_and_approval` (FAR 6.303), `limited_sources_justification` (FAR 8.405-6), `exception_to_fair_opportunity` (FAR 16.505(b)(2)), `brand_name_justification`, `simplified_acquisition_sole_source` (FAR 13.106-1(b) / 13.501), `other_sole_source_justification`, `determination_and_findings`, `notice_or_synopsis`, `contract_award_or_modification` or `other`."
authority_cited = "The legal authorities cited for not competing, as written, `; `-separated."
authority_plain = "A plain-language category for each authority, from a fixed list of 16 in the prompt (e.g. `only one responsible source`, `unusual and compelling urgency`, `simplified acquisition: only one source reasonably available`, `other`), `; `-separated."
authority_quote = "The verbatim quotes the authorities came from, ` | `-separated."
summary_model_written = "Why the agency is not competing it, in the model's words."
reason_quote = "The verbatim sentence the summary is based on."
estimated_value_usd = "The value stated in the J&A, US dollars. An approval ceiling is never reported as the value. Null when none passed the checks."
value_basis = "What the value covers: `total_including_options`, `base_only`, `total_options_not_stated`, `modification_or_increase_amount`, `ceiling_or_maximum`, `annual_or_per_period` or `other`. Null when there is no value."
value_redacted = "True if the value is redacted or blank in the document."
value_quote = "Verbatim quote the value came from."
value_quote_pages = "Where the quote is: `<resource_id>#p<page>` (`(transcribed)` for a transcribed page), `; `-separated."
vendor = "The proposed contractor named in the document."
vendor_quote = "Verbatim quote naming the vendor."
additional_vendors = "Other proposed contractors, `; `-separated."
covers_multiple_actions = "True if the J&A covers more than one action."
period_of_performance = "How long the work runs, in the model's words (e.g. `12 months`)."
period_quote = "Verbatim quote for the period."
signature_date = "The latest signature date, YYYY-MM-DD."
signature_quote = "Verbatim quote for the signature date."
signature_quote_pages = "Where the signature quote is (same form as `value_quote_pages`)."
market_research_summary_model_written = "The market research described, in the model's words."
market_research_quote = "Verbatim quote for the market research."
other_firms_named = "Other firms the document names, `; `-separated."
redaction_detected = "`yes` if any redaction evidence was found (see `redaction_evidence`), else `not detected`. \"not detected\" is not \"no\": black-box redactions in typed PDFs can leave no trace."
redaction_evidence = "Which evidence was found, `; `-separated: a `[REDACTED]` marker in transcribed text, an attachment filename saying redacted, the model finding a redaction, a redacted or blank value, a redacted person's name."
redaction_quote = "Verbatim quote showing a redaction."
notes_model_written = "The model's notes on the document."
prior_extension_count = "How many earlier bridges or extensions the document states, only when the quote states the number (\"the fifth bridge\" gives 4)."
prior_extension_count_quote = "Verbatim quote for the count."
covered_piids = "Contract, order or modification numbers this action awards, modifies, extends or is placed under, `; `-separated."
incumbent_piid = "The current or predecessor contract number."
incumbent_piid_quote = "Verbatim quote for the incumbent contract."
redaction_significant = "`yes`, `no` or `unclear`: the model's judgement whether the redactions remove substance (value, prices, rationale, vendor, market-research results) rather than only names and contact details."
redaction_significant_quote = "Verbatim quote for that judgement."
is_letter_contract = "`yes` or `no`: whether it is a letter contract or undefinitized action."
letter_contract_quote = "Verbatim quote for a letter contract."
funding_sources = "Named appropriation(s) or fund(s), as written, `; `-separated."
people_named = "Every person the document names whose name isn't redacted, as `name (title, organization)`, `; `-separated."
people_signature_block = "People in signature, approval and review blocks (signer or approver, contracting officer, competition advocate, legal reviewer); a redacted name shows as `[name redacted]`."
people_redacted_blocks = "Number of people entries whose name is redacted."
people_json = "The full people list as JSON: name, title, organization, role, redacted flag, signature-stamp flag, quote and a one-sentence model-written description for each."
values_dropped_by_checks = "Values the code checks removed, as `field='value' (reason)`, `; `-separated (e.g. a quote not found in the document)."
attachments = "Number of the notice's attachments the model read."
pages = "Number of pages read."
transcribed_pages = "Of those, pages whose text is a transcription."
truncated = "True if the document text was cut (at an attachment or page boundary) before it was sent."
garbled_text_layer = "True if the text has 3 or more letter-shifted common words (`7KH` for \"The\"): a font-encoding fault that leaves passages unreadable to the model."
chars_sent = "Characters of document text sent to the model."
chars_total = "Characters of document text in full."
model = "Model that made the extraction."
extract_version = "Version of the extraction prompt. Rows from older versions lack fields added since; filter on it to use one version."
checks_version = "Version of the code checks."
dataset_revision = "The dataset commit the document text was read from."
effort = "The model's effort setting for the call."
run_at = "When the extraction ran (UTC)."
experimental = "Always true: AI-generated."
record_json = "The full stored record as JSON, including the model's raw answer and the fields not published as columns."
contractor_named = "Second call: a current or previous contractor for this work that the document names."
contractor_named_quote = "Verbatim quote for `contractor_named`."
contractor_named_quote_pages = "Page number(s) of that quote, comma-separated."
new_source_approval_quote = "Second call: the document's statement of how a firm not yet approved can become a source."
new_source_approval_quote_pages = "Page number(s) of that quote."
ceiling_prior_usd = "Second call: the prior ceiling, only when the document states prior, increase and new ceiling and they add up."
ceiling_increase_usd = "The ceiling increase (same condition)."
ceiling_new_usd = "The new ceiling (same condition)."
ceiling_prior_quote = "Verbatim quote for the prior ceiling."
ceiling_increase_quote = "Verbatim quote for the increase."
ceiling_new_quote = "Verbatim quote for the new ceiling."
gao_protest_numbers = "GAO protest numbers (B-4xxxxx) mentioned in a sentence about a protest of this or a related procurement, `; `-separated; decisions cited as precedent left out."
dla_approved_sources = "On DLA's AVN Form S53: the approved sources (`CAGE | name`) from the form's own table, read by rule, `; `-separated."
nsns = "National Stock Numbers in the text, read by rule, `; `-separated."
interested_firms_named = "Firms (`CAGE | name` where given) the document names as having responded or expressed interest. Can include the firm that got the award; not a count of competitors. Blank means none found."
not_to_exceed_usd = "Second call: a stated not-to-exceed amount for the action."
not_to_exceed_quote = "Verbatim quote for it."
not_to_exceed_quote_pages = "Page number(s) of that quote."
delay_to_compete_quote = "Second call: the document's sentence on how long competing would delay the work."
delay_to_compete_quote_pages = "Page number(s) of that quote."
cost_to_compete_quote = "Second call: the document's sentence on what competing would cost."
cost_to_compete_quote_pages = "Page number(s) of that quote."
technical_data_reasons = "Why missing technical data blocks competition, read by rule from the quote: `data_not_available`, `government_lacks_rights`, `government_does_not_own_data`, `data_uneconomical_to_obtain`, `; `-joined."
technical_data_reasons_quote = "Verbatim quote for those reasons."
technical_data_reasons_quote_pages = "Page number(s) of that quote."
second_call_version = "The second call's prompt and checks version."
interested_firms_contractor_entry = "The entries of `interested_firms_named` that are the J&A's own proposed contractor (`vendor` or `additional_vendors`), by exact name once case, punctuation and legal suffixes are removed."
extras_record_json = "The second call's stored record for the published fields only, as JSON (answers, what the checks kept, model, prompt version, cost)."

[tables.extractions_excluded]
file = "analysis/extractions_excluded.parquet"
config = "none (not a config on the card)"
grain = "EXPERIMENTAL. One row per notice left out of `extractions` on purpose, with the reason and its latest record, so later runs don't extract it again."
primary_key = "notice_id"

[tables.extractions_excluded.columns]
notice_id = "The notice (`notices.notice_id`)."
exclude_reason = "`special_notice_not_ja` (a Special Notice with no attachment titled as a justification; a text rule, no model call) or `model_says_not_ja` (the model's `is_ja` is `no`)."
status = "`extracted` or `skipped`: which kind of record the row holds."
sam_link = "The notice's public page."
title = "Notice title."
agency = "Notice agency."
sub_tier = "Notice sub-tier."
posted_date = "Notice posted date."
is_ja = "The model's `is_ja` answer in the record, when there is one."
experimental = "Always true."
record_json = "The full stored record as JSON."
extras_record_json = "The second call's stored record, if any (none so far)."

[tables.theme_status]
file = "analysis/theme_status.parquet"
config = "experimental_theme_status"
grain = "EXPERIMENTAL, AI-generated. One row per notice in the 2026-10-18 theme snapshot: whether it was reviewed and its result for each of the three themes. Not refreshed; notices collected later have no row."
primary_key = "notice_id"

[tables.theme_status.columns]
notice_id = "The notice (`notices.notice_id`)."
sam_link = "The notice's public page."
title = "Notice title."
agency = "Notice agency."
sub_tier = "Notice sub-tier."
posted_date = "Notice posted date."
review_status = "`reviewed` or `not_reviewed`."
not_reviewed_reason = "`no_text` (under 200 characters of text) or `too_long` (over 60,000 characters, outside the validated range)."
agency_delay_cause_status = "`tagged`, `not_tagged`, `no_candidate_passages` (the keyword screen found nothing, so no model call) or `not_reviewed`."
agency_delay_cause_tags = "Number of `agency_delay_cause` rows for this notice in `theme_tags`."
agency_delay_cause_prompt_version = "Prompt version used for this theme."
sources_rejected_status = "As `agency_delay_cause_status`, for `sources_rejected`."
sources_rejected_tags = "Number of `sources_rejected` rows in `theme_tags`."
sources_rejected_prompt_version = "Prompt version used for this theme."
workforce_cause_status = "As `agency_delay_cause_status`, for `workforce_cause`."
workforce_cause_tags = "Number of `workforce_cause` rows in `theme_tags`."
workforce_cause_prompt_version = "Prompt version used for this theme."
pages = "Pages in the document reviewed."
transcribed_pages = "Of those, pages whose text is a transcription."
model = "Model used."
run_at = "When the review ran (UTC)."
dataset_revision = "The dataset commit the text was read from."
review_json = "The full review record as JSON (for a not-reviewed notice, just the reason)."
experimental = "Always true."

[tables.theme_tags]
file = "analysis/theme_tags.parquet"
config = "experimental_theme_tags"
grain = "EXPERIMENTAL, AI-generated. One row per tagged passage in the 2026-10-18 theme snapshot. A tag is a possible issue for a person to check against the document, not a finding."

[tables.theme_tags.columns]
notice_id = "The notice (`notices.notice_id`)."
sam_link = "The notice's public page."
title = "Notice title."
agency = "Notice agency."
posted_date = "Notice posted date."
category = "The theme: `workforce_cause`, `agency_delay_cause` or `sources_rejected` (definitions in the card)."
category_kind = "`possible issue` (agency_delay_cause) or `tracked fact` (the other two)."
category_status = "The theme's validation status: `screening` for all three (none reached `ready`; see docs/analysis_validation.md)."
quote = "The verbatim passage the tag is based on; found in the document's page text."
quote2 = "A second verbatim passage, when the model gave one."
explanation_model_written = "The model's explanation."
n_firms = "`sources_rejected` only: the number of firms found not capable, when the model gave one."
quote_match = "How the quote was found: `exact` or `normalized` (after whitespace and quote-mark normalisation)."
quote_on_transcribed_page = "True if the quote is on a machine-transcribed page."
quote_pages = "Where the quote is, as JSON: resource_id, page_number and text_source for each page."
found_in_passes = "Which of the two review passes found the tag."
all_passes = "True if both passes found it."
method = "`confirm`: a keyword screen picked candidate passages and the model confirmed them."
model = "Model used."
prompt_version = "Prompt version for this theme."
dataset_revision = "The dataset commit the text was read from."
run_at = "When the review ran (UTC)."
experimental = "Always true."
note = "Always \"Possible issue for a person to check against the document. Not a finding.\""
record_json = "The tag's full record as JSON."

[[joins]]
left = "notices.notice_id"
right = "attachments.notice_id"
kind = "||--o{"
label = "notice_id"
note = "Exact join. Some notices list no attachments."

[[joins]]
left = "attachments.resource_id"
right = "pages.resource_id"
kind = "||--o{"
label = "notice_id + resource_id"
note = "Exact join on both `notice_id` and `resource_id` (the same resource can be on several notices). `sha256` identifies the exact file."

[[joins]]
left = "notices.notice_id"
right = "extractions.notice_id"
kind = "||--o|"
label = "notice_id"
note = "Exact join, at most one extraction per notice."

[[joins]]
left = "notices.notice_id"
right = "extractions_excluded.notice_id"
kind = "||--o|"
label = "notice_id"
note = "Exact join. A notice is in `extractions` or `extractions_excluded`, never both."

[[joins]]
left = "notices.notice_id"
right = "theme_status.notice_id"
kind = "||--o|"
label = "notice_id"
note = "Exact join; only notices in the 2026-10-18 snapshot."

[[joins]]
left = "theme_status.notice_id"
right = "theme_tags.notice_id"
kind = "||--o{"
label = "notice_id"
note = "Exact join; `<theme>_tags` counts the rows per theme."
