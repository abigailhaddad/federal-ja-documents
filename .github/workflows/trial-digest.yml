# THROWAWAY: backtest of the digest on 7 past days, dry runs only (nothing is
# sent, no state is written). Remove before merging.
# Days the collector loaded in bulk (Oct 16) are simulated by posting date.
name: Digest backtest (throwaway)

on:
  push:
    branches: [digest]
    paths: [.github/workflows/trial-digest.yml]

env:
  REV: e93882dcc18c1d76244974093b3696fd5e5e016e

jobs:
  # the one-notice day first: a schema or API error shows up here for cents
  first:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Dry run
        run: |
          uv run python -m federal_ja.analysis digest --dry-run --out out/2026-10-19 --revision "$REV" \
            --max-usd 0.28 --first-seen-from 2026-10-19T00:00:00+00:00 --first-seen-to 2026-10-19T23:59:59+00:00 \
            --as-of 2026-10-19T16:00:00+00:00 2> >(tee out_2026-10-19.log >&2)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-2026-10-19
          path: |
            out/
            out_*.log

  day:
    needs: first
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {label: "2026-10-15", args: "--first-seen-from 2026-10-16T00:00:00+00:00 --first-seen-to 2026-10-16T23:59:59+00:00 --posted-from 2026-10-14 --posted-to 2026-10-14 --as-of 2026-10-15T16:00:00+00:00"}
          - {label: "2026-10-16", args: "--first-seen-from 2026-10-16T00:00:00+00:00 --first-seen-to 2026-10-16T23:59:59+00:00 --posted-from 2026-10-15 --posted-to 2026-10-15 --as-of 2026-10-16T16:00:00+00:00"}
          - {label: "2026-10-17", args: "--first-seen-from 2026-10-17T00:00:00+00:00 --first-seen-to 2026-10-17T23:59:59+00:00 --as-of 2026-10-17T16:00:00+00:00"}
          - {label: "2026-10-18", args: "--first-seen-from 2026-10-18T00:00:00+00:00 --first-seen-to 2026-10-18T23:59:59+00:00 --as-of 2026-10-18T22:00:00+00:00"}
          - {label: "2026-10-20", args: "--first-seen-from 2026-10-20T00:00:00+00:00 --first-seen-to 2026-10-20T23:59:59+00:00 --as-of 2026-10-20T16:00:00+00:00"}
          - {label: "2026-10-21", args: "--first-seen-from 2026-10-21T00:00:00+00:00 --first-seen-to 2026-10-21T23:59:59+00:00 --as-of 2026-10-21T16:00:00+00:00"}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Dry run
        run: |
          uv run python -m federal_ja.analysis digest --dry-run --out "out/${{ matrix.label }}" \
            --revision "$REV" --max-usd 0.28 ${{ matrix.args }} 2> >(tee "out_${{ matrix.label }}.log" >&2)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-${{ matrix.label }}
          path: |
            out/
            out_*.log
