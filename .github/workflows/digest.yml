name: Daily J&A digest email

# Builds the daily "Whoa J&As" email (python -m federal_ja.analysis digest,
# docs/digest.md) and sends it through Buttondown.
#
# When it runs:
# * after each "Daily experimental field extraction" run that the daily
#   collection triggered (not after manual backfill runs), so the picks can use
#   that day's extraction fields;
# * after each "Daily J&A collection" run, but only while the extraction job is
#   off (EXTRACT_DAILY_ENABLED != 'true'); otherwise the extraction run above
#   follows and triggers this;
# * a fallback schedule (22:30 UTC) for days when neither of the above fired.
#   If no digest went out that day it sends one (with no new notices, the
#   short "nothing whoa-worthy (0 new notices)" email).
# One email a day (2026-10-22): once a digest has been sent on an Eastern-time
# day, every later run that day sends nothing, even with new notices; they go
# in the next day's digest. Every trigger uses the same saved watermark
# (analysis/digest_state.json in the dataset), so a notice is covered once.
#
# Sending: automatic runs send only when the repository variable
# DIGEST_ENABLED is 'true'; otherwise the workflow_run triggers build a dry run
# and upload it as an artifact (the schedule does nothing). Manual runs
# (workflow_dispatch) are dry runs unless dry_run is unticked.
# workflow_run and schedule triggers only fire for the workflow file on the
# default branch.
#
# After a successful send (only then), the email is also saved to the
# dataset's analysis/digest_archive/ (src/federal_ja/digest/archive.py), and the
# "site" job rebuilds and deploys the public web archive + RSS feed
# (deploy-site.yml, https://woah-jas.abigailhaddad.com; 2026-10-21). That job is
# skipped for dry runs, drafts and failed sends, and its deploy step is skipped
# with a notice while CLOUDFLARE_API_TOKEN is unset, so the email never depends
# on Cloudflare.
#
# Secrets: ANTHROPIC_API_KEY, HF_TOKEN (writes the state file and the archive),
# BUTTONDOWN_API_KEY; CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (site deploy).
# Variable: ANTHROPIC_WORKSPACE_ID (optional).
on:
  workflow_run:
    workflows: ["Daily experimental field extraction", "Daily J&A collection"]
    types: [completed]
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build the digest and upload it; send nothing, save no state)"
        type: boolean
        default: true
      max_usd:
        description: "Spend cap for this run's model calls (USD)"
        default: "0.35"
      first_seen_window:
        # 2026-10-21: preview a change on a past day without touching the
        # state. Dry runs only (the CLI refuses a backtest window with --send).
        description: "Dry-run preview window, FROM,TO as ISO times (first_seen_at); blank = the normal window"
        default: ""

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.DIGEST_ENABLED == 'true') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Daily experimental field extraction' &&
       github.event.workflow_run.event == 'workflow_run' &&
       (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Daily J&A collection' &&
       github.event.workflow_run.conclusion == 'success' &&
       vars.EXTRACT_DAILY_ENABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sent: ${{ steps.digest.outputs.sent }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Build (and send) the digest
        id: digest
        shell: bash  # bash -eo pipefail
        run: |
          MODE="--dry-run"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "false" ]; then MODE="--send"; fi
          elif [ "${{ vars.DIGEST_ENABLED }}" = "true" ]; then
            MODE="--send"
          fi
          WINDOW=()
          W="${{ inputs.first_seen_window }}"
          if [ -n "$W" ]; then
            if [ "$MODE" != "--dry-run" ]; then echo "a preview window needs a dry run"; exit 1; fi
            WINDOW=(--first-seen-from "${W%%,*}" --first-seen-to "${W##*,}" --as-of "${W##*,}")
          fi
          echo "mode: $MODE ${WINDOW[*]}"
          uv run python -m federal_ja.analysis digest $MODE --out work/digest "${WINDOW[@]}" \
            --max-usd "${{ inputs.max_usd || '0.35' }}" 2> >(tee work_digest.log >&2)
          # "sent" is set in picks.json only after the email, the state and the
          # archive entry were all saved; the site job runs only then
          echo "sent=$(jq -r '.sent // false' work/digest/picks.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest
          path: |
            work/digest/
            work_digest.log
          if-no-files-found: ignore

  # The web archive + RSS feed, rebuilt from the archive after each sent digest.
  site:
    needs: digest
    if: needs.digest.outputs.sent == 'true'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
