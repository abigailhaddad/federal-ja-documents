# THROWAWAY: trial of five more fields. Runs the trial prompt twice and the
# extract3 prompt once on the 18 trial answer-key notices. Remove before merging.
name: Trial fields (throwaway)

on:
  push:
    branches: [analysis-people-field]
    paths: [.github/workflows/trial-ab.yml]

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: trialA, ref: ab60fc9df348b26ff1953da4507a78e3ce782d6b}
          - {label: trialB, ref: ab60fc9df348b26ff1953da4507a78e3ce782d6b}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      REV: 8b7d8208fef60cf911934e167b33515b8ebbaffb
      LABEL: ${{ matrix.label }}
      MAX_USD: "0.15"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Extract
        run: |
          printf '%s\n' 1db3f3a66b70487f852683e78da543f9 53d80bf144804de8a5e5138dd62cf873 8febc2f3caa144d8b08672d26fbd2a1b 085682f126fe48469dc67e2031a3f08a \
            b8242f6fd1b843d7b0e8ea53c99e58b9 5a257e103ec14626a51b2cd8238e947c aa9f3d3ac5bc48729f4d86c726021efe f2ddf895814e4515b27df4decf472d70 \
            f157c0a476c048b5a7c759272c828366 f6e01a440a86420dac91c8e8be5b3649 6909e1e3c9a74255b6eaaa93da7b2769 cb890447f40448d8ad865f3339b93634 \
            8a1690068b01421d9c9271f6f9ef0fed 224a187b71c24fd7bc19eaf2ca6921a0 15b08347f2fa4283ac78eb1a86e40299 1b1c624ce97147b48a67a3d1a3be951d \
            eb71d389b99c4d6dbe9ff72b3a80861d c3461563b2b94dbca9f7535aecf6a325 > ids.txt
          uv run python -m federal_ja.analysis extract --notice-file ids.txt \
            --out "out/$LABEL" --data-dir hf --revision "$REV" \
            --workers 4 --max-usd "$MAX_USD" 2> >(tee "out_$LABEL.log" >&2)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-${{ env.LABEL }}
          path: |
            out/
            out_*.log
