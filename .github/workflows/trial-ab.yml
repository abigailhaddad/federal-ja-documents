# THROWAWAY: the one-call extraction (prompt extract6). A compile check on one
# short notice, then two runs on the 50 validation notices (18 trial + 40
# extract3, 8 shared). Remove before merging.
name: One-call extract6 trial (throwaway)

on:
  push:
    branches: [analysis-people-field]
    paths: [.github/workflows/trial-ab.yml]

env:
  REV: 8b7d8208fef60cf911934e167b33515b8ebbaffb
  REF: 2db2ccef5c7dd5d6edc12f0f30526981073660d2

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Extract one notice (a 400 if the schema does not compile)
        run: |
          echo c3461563b2b94dbca9f7535aecf6a325 > ids.txt
          uv run python -m federal_ja.analysis extract --notice-file ids.txt \
            --out out/compile --data-dir hf --revision "$REV" --workers 1 --max-usd 0.05 2> >(tee out_compile.log >&2)
          test -s out/compile/extractions.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extract6-compile
          path: |
            out/
            out_*.log

  extract:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        label: [runA, runB]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      LABEL: ${{ matrix.label }}
      MAX_USD: "0.55"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Extract
        run: |
          printf '%s\n' 1db3f3a66b70487f852683e78da543f9 53d80bf144804de8a5e5138dd62cf873 8febc2f3caa144d8b08672d26fbd2a1b 085682f126fe48469dc67e2031a3f08a b8242f6fd1b843d7b0e8ea53c99e58b9 5a257e103ec14626a51b2cd8238e947c aa9f3d3ac5bc48729f4d86c726021efe f2ddf895814e4515b27df4decf472d70 f157c0a476c048b5a7c759272c828366 f6e01a440a86420dac91c8e8be5b3649 6909e1e3c9a74255b6eaaa93da7b2769 cb890447f40448d8ad865f3339b93634 8a1690068b01421d9c9271f6f9ef0fed 224a187b71c24fd7bc19eaf2ca6921a0 15b08347f2fa4283ac78eb1a86e40299 1b1c624ce97147b48a67a3d1a3be951d eb71d389b99c4d6dbe9ff72b3a80861d c3461563b2b94dbca9f7535aecf6a325 8637832a9e7d4c9fb46a3e6a408e774c 597e23efdbae4858881db82e3e9f1b39 1996aeb1946e433faa4f3e0eaec71a6b d0de7be558744304be25dec192da2914 3e75fdad44b148dea75054643b0c6bec 0d6e901e95b249bf930c73593fd16475 d7207bb1b58346dc88493972f641561b 560de14923164ce29abf08ac67dc943f b4f49d6d4e5b42f08f1f5642f17a588b 2590b4fe004f47f8a9d9f64ec3922f05 5e6b435738b24553b480e192ec14aa86 ded7835dbcd64b5d8d242715dd26a931 5a005eaf1dec49f7aa264ceb2100c4a9 406cf227f2194376bbd14e8ea9e619c4 1079d70801d94affad24bed615e6931a 424e6eab35514bce9c8b50bd37c1e65a a6bbb244cd0444f0a8ac2a7bb8004c34 3378022faa794bcca0a6812e8447f288 de17f747dddb478b89c31008575a3a32 b729c725159c4f138864b4ac6cbc1017 12ba9d4b0fcf455ab50a0d05db46c22a 0e11c796caf54986b8b05c4417c3bfca 29df37c3e284494e955226b5d42538c2 c7a671221e654118a0abb9e94c915051 b5c3c23b4e65464dadfc362f9fc364da b5bf292615a6456a8cb6e88c1fcaff82 d91c1dc52c064840abe98d7d77596d7e 9157a4ea266f4e96a3f99e19a822fe32 aa5a77a6ce344e90b2a0e3fc06f176ba c56bc7155e34405fb41ccbcde6985f7d ee787559fc674911bb7c08938124ce09 3b2fb35ae3654886843e3de2808055d8  > ids.txt
          uv run python -m federal_ja.analysis extract --notice-file ids.txt \
