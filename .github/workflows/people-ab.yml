# THROWAWAY: validation runs for the people field. Runs field extraction
# (this branch) twice on the 40 answer-key notices at a pinned dataset
# revision and uploads the output. Remove before merging.
name: People field validation (throwaway)

on:
  push:
    branches: [analysis-people-field]
    paths: [.github/workflows/people-ab.yml]

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        label: [maxtok]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      REV: 8b7d8208fef60cf911934e167b33515b8ebbaffb
      LABEL: ${{ matrix.label }}
      MAX_USD: "0.05"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Extract
        run: |
          # one garbled-text notice that hit the 16,000-token output limit in all four runs:
          # does it finish with a 32,000-token limit, and how long is the answer?
          echo b5c3c23b4e65464dadfc362f9fc364da > ids.txt
          uv run python -c "
          from federal_ja.analysis import cli, llm
          orig = llm.call
          llm.call = lambda *a, **k: orig(*a, **{**k, 'max_tokens': 32000})
          raise SystemExit(cli.main(['extract', '--notice-file', 'ids.txt', '--out', 'out/$LABEL', '--data-dir', 'hf',
                                     '--revision', '$REV', '--retries', '0', '--max-usd', '$MAX_USD']))
          " 2> >(tee "out_$LABEL.log" >&2)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: people-${{ env.LABEL }}
          path: |
            out/
            out_*.log
