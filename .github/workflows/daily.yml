name: Daily J&A collection

# Runs daily after SAM.gov refreshes its active-notices CSV (~03:30 UTC).
# The scheduled run is OFF until the repository variable DAILY_ENABLED is set
# to "true" (Settings -> Secrets and variables -> Actions -> Variables).
# Manual runs (workflow_dispatch) always work.
# 2026-10-22: GitHub fired this schedule 5-7 hours late all week, so the daily
# run is now started at 06:15 UTC by a Cloudflare Worker cron calling
# workflow_dispatch (cron-trigger/). This schedule stays as a backup: if the
# Worker's run already collected everything, a late scheduled run finds nothing
# new and the digest it triggers sends nothing.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      archives:
        description: "Yearly archive CSVs: auto (only when their ETag changed), always, never"
        default: auto
      max_usd:
        description: "Transcription spend cap for this run (USD)"
        default: "2"
      publish:
        description: "Publish to Hugging Face"
        type: boolean
        default: true
      allow_shrink:
        description: "Publish even if notices/attachments have fewer rows than on Hugging Face"
        type: boolean
        default: false
      allow_small_csv:
        description: "Merge SAM's active CSV even if it parsed to under 10,000 rows"
        type: boolean
        default: false

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ALLOW_SHRINK: ${{ inputs.allow_shrink == true && '1' || '' }}
      ALLOW_SMALL_CSV: ${{ inputs.allow_small_csv == true && '1' || '' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler (pdftotext reads the PDFs' text layers)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Collect
        shell: bash  # bash -eo pipefail, so `| tee` cannot hide a failure
        run: |
          PUBLISH_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            PUBLISH_FLAG="--publish"
          fi
          uv run ja-collect --workdir work daily \
            --archives "${{ inputs.archives || 'auto' }}" \
            --max-usd "${{ inputs.max_usd || '2' }}" \
            --links \
            $PUBLISH_FLAG | tee run_summary.json
      - name: Disk usage
        if: always()
        run: df -h . && du -sh work || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-summary
          path: |
            run_summary.json
            work/data/collection_state.json
          if-no-files-found: ignore

  # Downloadable SQLite, in its own job so only it gets write access to the repo (to replace the release):
  # download the tables now on Hugging Face (not files/), stop if their columns no longer match
  # docs/tables.toml, build one SQLite file and attach it to the GitHub release `latest-data`. The release
  # is deleted and recreated whenever the Hugging Face commit changes, so it always holds one file. Runs only
  # after a collection run that published.
  sqlite:
    needs: collect
    if: needs.collect.result == 'success' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: SQLite file on the latest-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m federal_ja.collect.data_docs fetch hf_data
          uv run python -m federal_ja.collect.data_docs check hf_data
          sha=$(cat hf_data/REVISION)
          if gh release view latest-data --json body --jq .body 2>/dev/null | grep -q "$sha"; then
            echo "latest-data already holds Hugging Face commit $sha; nothing to do"
            exit 0
          fi
          built=$(uv run python -m federal_ja.collect.build_sqlite hf_data federal-ja-documents.sqlite | tail -n 1)
          echo "$built"
          gh release delete latest-data --cleanup-tag --yes 2>/dev/null || true
          gh release create latest-data federal-ja-documents.sqlite --title "Latest data (SQLite)" --notes "SQLite copy of the tables in https://huggingface.co/datasets/abigailhaddad/federal-ja-documents at commit $sha (not the original files), built $(date -u +%Y-%m-%d) by the daily collection workflow. One table per parquet file; the analysis tables are experimental and AI-generated. Columns are described in docs/data_dictionary.md. ${built#wrote }"

  # GitHub disables scheduled workflows in a public repo after 60 days with no commits, and this workflow
  # never commits. Same check as oira-meetings: an empty commit once the newest commit is 45+ days old.
  keepalive:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      contents: write
    # Never let a keepalive problem mark the collection run failed (digest.yml follows this workflow).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive commit
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "newest commit is $age days old"
          if [ "$age" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keepalive: no commits in $age days"
            git push
          fi
